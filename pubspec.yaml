name: mytodo
description: "나의 할일에 대해 작성합니다."
publish_to: 'none'

version: 1.6.0+38

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  table_calendar: ^3.1.2
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.2
  package_info_plus: ^10.2.0
  device_info_plus: ^13.2.0
  uuid: ^4.5.1

  # 로컬 푸시 알림
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0

  # Firebase (인증 + 클라우드 동기화)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  # 외부 링크/메일 + 이미지 선택 + 로컬 저장 경로
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # HTTP (한국 공휴일 API)
  http: ^1.2.2

  # 일본 공휴일 (오프라인)
  holiday_jp: ^0.0.8
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 아이콘/스플래시 자동 생성
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/sounds/

# 앱 아이콘 자동 생성 설정 — `dart run flutter_launcher_icons` 으로 실행
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#6C5CE7"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

# 스플래시 화면 자동 생성 설정 — `dart run flutter_native_splash:create` 으로 실행
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icon/icon_foreground.png"
  color_dark: "#15151B"
  image_dark: "assets/icon/icon_foreground.png"
  android_12:
    image: "assets/icon/icon_foreground.png"
    color: "#FFFFFF"
    image_dark: "assets/icon/icon_foreground.png"
    color_dark: "#15151B"
  ios: true
  android: true
